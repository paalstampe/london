<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London Nabolag</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f2f0ec;
    --panel: #ffffff;
    --border: #ddd9d0;
    --text: #1c1c1a;
    --muted: #7a756e;
    --Central: #5a3e28;
    --North: #1e4d7a;
    --South: #6e2222;
    --East: #4a3a8a;
    --West: #1a5c4e;
    --fav: #b8821a;
    --fav-bg: #fdf3e0;
  }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--text);
    color: #f2f0ec;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .header-title {
    font-size: 1.05rem;
    font-weight: normal;
    letter-spacing: 0.01em;
  }
  .header-title span { opacity: 0.5; font-size: 0.85rem; margin-left: 10px; font-family: -apple-system, sans-serif; }

  .header-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .zone-btn {
    padding: 5px 11px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-size: 0.75rem;
    font-family: -apple-system, sans-serif;
    cursor: pointer;
    transition: all 0.12s;
    letter-spacing: 0.02em;
  }
  .zone-btn:hover { background: rgba(255,255,255,0.12); color: white; }
  .zone-btn.active { background: rgba(255,255,255,0.18); color: white; border-color: rgba(255,255,255,0.5); }
  .zone-btn.fav-btn.active { background: var(--fav); border-color: var(--fav); color: white; }
  .sep { color: rgba(255,255,255,0.2); font-size: 0.8rem; }

  .layout {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-search {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-search input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 0.82rem;
    font-family: -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .sidebar-search input:focus { border-color: #999; }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .zone-group { margin-bottom: 4px; }
  .zone-label {
    padding: 6px 14px 4px;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .place-item {
    padding: 7px 14px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    transition: background 0.1s;
  }
  .place-item:hover { background: var(--bg); }
  .place-item.active { background: var(--fav-bg); }
  .place-item.hidden { display: none; }

  .place-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }
  .place-item-text { min-width: 0; }
  .place-item-name {
    font-size: 0.83rem;
    line-height: 1.3;
    color: var(--text);
    font-family: -apple-system, sans-serif;
  }
  .place-item-name .star { color: var(--fav); margin-right: 2px; }
  .place-item-note {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    margin-top: 1px;
  }

  .sidebar-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dl-btn {
    padding: 5px 10px;
    background: var(--text);
    color: white;
    border: none;
    border-radius: 3px;
    font-size: 0.72rem;
    font-family: -apple-system, sans-serif;
    cursor: pointer;
    transition: opacity 0.12s;
  }
  .dl-btn:hover { opacity: 0.8; }

  /* Map */
  #map {
    flex: 1;
    z-index: 1;
  }

  /* Popup */
  .custom-popup .leaflet-popup-content-wrapper {
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    padding: 0;
    overflow: hidden;
  }
  .custom-popup .leaflet-popup-content {
    margin: 0;
    min-width: 200px;
  }
  .popup-inner { padding: 14px 16px 12px; }
  .popup-zone {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .popup-name {
    font-size: 0.95rem;
    font-weight: normal;
    font-family: 'Georgia', serif;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .popup-note {
    font-size: 0.75rem;
    color: #666;
    font-family: -apple-system, sans-serif;
    line-height: 1.4;
  }
  .popup-fav {
    display: inline-block;
    background: var(--fav-bg);
    color: var(--fav);
    font-size: 0.68rem;
    font-family: -apple-system, sans-serif;
    padding: 2px 8px;
    border-top: 1px solid #f0e4c8;
    width: 100%;
    text-align: center;
  }
  .popup-notvisited {
    display: inline-block;
    background: #f0f0f0;
    color: #777;
    font-size: 0.68rem;
    font-family: -apple-system, sans-serif;
    padding: 2px 8px;
    border-top: 1px solid #e5e5e5;
    width: 100%;
    text-align: center;
  }
  .place-item.not-visited .place-item-name,
  .place-item.not-visited .place-item-note { opacity: 0.6; }
  .place-item-note em { font-style: normal; color: var(--fav); }

  /* Legend */
  .map-legend {
    background: white;
    padding: 10px 12px;
    border-radius: 4px;
    font-family: -apple-system, sans-serif;
    font-size: 0.72rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    line-height: 1.8;
  }
  .legend-title { font-weight: 600; margin-bottom: 4px; color: #333; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-row { display: flex; align-items: center; gap: 6px; color: #555; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-star { color: var(--fav); font-size: 0.9rem; }

  @media (max-width: 600px) {
    .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .layout { flex-direction: column; }
    #map { min-height: 60vh; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title">London Nabolag <span id="count-label"></span></div>
  <div class="header-filters">
    <button class="zone-btn active" data-filter="all">Alle</button>
    <span class="sep">|</span>
    <button class="zone-btn" data-filter="Central">Central</button>
    <button class="zone-btn" data-filter="North">Nord</button>
    <button class="zone-btn" data-filter="South">Sør</button>
    <button class="zone-btn" data-filter="East">Øst</button>
    <button class="zone-btn" data-filter="West">Vest</button>
    <span class="sep">|</span>
    <button class="zone-btn fav-btn" data-filter="fav">⭐ Favoritter</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" id="search" placeholder="Søk etter sted…" autocomplete="off">
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
    <div class="sidebar-footer">
      <span id="footer-count"></span>
      <button class="dl-btn" id="dl-kml">↓ Last ned KML</button>
    </div>
  </div>
  <div id="map"></div>
</div>

<script>
const ZONE_COLORS = {
  Central: "#5a3e28",
  North:   "#1e4d7a",
  South:   "#6e2222",
  East:    "#4a3a8a",
  West:    "#1a5c4e"
};

const PLACES = [
  // CENTRAL
  {name:"Marylebone High Street",zone:"Central",lat:51.5207,lng:-0.1519,fav:true,visited:true,note:"Marylebone Village inkl. Chiltern Street"},
  {name:"Lamb's Conduit Street",zone:"Central",lat:51.5216,lng:-0.1183,fav:true,visited:true,note:"East Bloomsbury"},
  {name:"Elizabeth Street / Orange Square",zone:"Central",lat:51.4938,lng:-0.1511,fav:true,visited:true,note:"Lower Belgravia – Pimlico Road, Lower Sloane Street"},
  {name:"Mount Street",zone:"Central",lat:51.5097,lng:-0.1508,fav:true,visited:true,note:"Mayfair"},
  {name:"Motcomb Street",zone:"Central",lat:51.4995,lng:-0.1564,fav:false,visited:true,note:"Belgravia"},
  {name:"Shepherd Market",zone:"Central",lat:51.5066,lng:-0.1469,fav:false,visited:true,note:"Mayfair"},
  {name:"Connaught Village",zone:"Central",lat:51.5146,lng:-0.1651,fav:false,visited:true,note:"W2"},
  {name:"Exmouth Market",zone:"Central",lat:51.5258,lng:-0.1093,fav:false,visited:true,note:"Clerkenwell"},
  // NORTH
  {name:"Stoke Newington Church Street",zone:"North",lat:51.5613,lng:-0.0828,fav:true,visited:true,note:"N16"},
  {name:"Upper Street, Islington",zone:"North",lat:51.5383,lng:-0.1024,fav:false,visited:true,note:"Angel / Islington"},
  {name:"Primrose Hill",zone:"North",lat:51.5413,lng:-0.1533,fav:false,visited:true,note:"NW3"},
  {name:"St John's Wood",zone:"North",lat:51.5343,lng:-0.1737,fav:false,visited:true,note:"St John's Wood High Street og Circus Road"},
  {name:"Crouch End",zone:"North",lat:51.5796,lng:-0.1234,fav:false,visited:true,note:"N8"},
  {name:"Highgate Village",zone:"North",lat:51.5714,lng:-0.1500,fav:false,visited:true,note:"N6"},
  {name:"Hampstead Village",zone:"North",lat:51.5546,lng:-0.1783,fav:false,visited:true,note:"NW3"},
  {name:"Camden Passage",zone:"North",lat:51.5347,lng:-0.1040,fav:false,visited:true,note:"Angel og Camden Passage – antikkmarked"},
  {name:"Walthamstow Village",zone:"North",lat:51.5834,lng:-0.0176,fav:false,visited:false,note:"E17"},
  {name:"Muswell Hill",zone:"North",lat:51.5914,lng:-0.1427,fav:false,visited:false,note:"N10"},
  // SOUTH
  {name:"Bermondsey Street",zone:"South",lat:51.5008,lng:-0.0818,fav:true,visited:true,note:"SE1 – White Cube, Maltby St, Beer Mile"},
  {name:"Abbeville Village",zone:"South",lat:51.4561,lng:-0.1381,fav:true,visited:true,note:"Clapham SW4"},
  {name:"Northcote Road",zone:"South",lat:51.4572,lng:-0.1656,fav:false,visited:true,note:"Battersea / Clapham"},
  {name:"East Dulwich",zone:"South",lat:51.4617,lng:-0.0800,fav:false,visited:true,note:"SE22"},
  {name:"Clapham (The Polygon)",zone:"South",lat:51.4630,lng:-0.1370,fav:false,visited:true,note:"Clapham Old Town SW4"},
  {name:"Bellenden Road",zone:"South",lat:51.4697,lng:-0.0729,fav:false,visited:true,note:"Peckham SE15"},
  {name:"Brixton Village",zone:"South",lat:51.4625,lng:-0.1122,fav:false,visited:true,note:"SW9"},
  {name:"Crystal Palace Triangle",zone:"South",lat:51.4195,lng:-0.0839,fav:false,visited:true,note:"SE19"},
  {name:"Forest Hill / Sydenham",zone:"South",lat:51.4382,lng:-0.0572,fav:false,visited:true,note:"SE23"},
  {name:"Blackheath",zone:"South",lat:51.4661,lng:0.0091,fav:false,visited:true,note:"SE3"},
  {name:"Dulwich Village",zone:"South",lat:51.4506,lng:-0.0855,fav:false,visited:false,note:"SE21 – Dulwich Picture Gallery"},
  {name:"Herne Hill",zone:"South",lat:51.4545,lng:-0.0967,fav:false,visited:false,note:"SE24 – Brockwell Park"},
  {name:"Balham / Streatham Hill",zone:"South",lat:51.4432,lng:-0.1525,fav:false,visited:false,note:"SW12 / SW16"},
  {name:"Nunhead",zone:"South",lat:51.4655,lng:-0.0587,fav:false,visited:false,note:"SE15"},
  {name:"Tooting",zone:"South",lat:51.4271,lng:-0.1680,fav:false,visited:false,note:"SW17"},
  // EAST
  {name:"Columbia Road",zone:"East",lat:51.5291,lng:-0.0698,fav:true,visited:true,note:"E2 – blomstermarked søndag"},
  {name:"Broadway Market",zone:"East",lat:51.5367,lng:-0.0617,fav:true,visited:true,note:"E8 – lørdag"},
  {name:"Shoreditch / Redchurch Street",zone:"East",lat:51.5243,lng:-0.0773,fav:true,visited:true,note:"E1 – Brick Lane"},
  {name:"London Fields",zone:"East",lat:51.5418,lng:-0.0602,fav:true,visited:true,note:"E8 – Hackney"},
  {name:"Whitecross Street",zone:"East",lat:51.5230,lng:-0.0929,fav:false,visited:true,note:"EC1 – street food"},
  {name:"Victoria Park Village",zone:"East",lat:51.5383,lng:-0.0438,fav:false,visited:true,note:"E9"},
  {name:"Hackney Wick",zone:"East",lat:51.5446,lng:-0.0257,fav:false,visited:true,note:"E9 – rå industriell karakter"},
  {name:"Wapping / Shadwell",zone:"East",lat:51.5055,lng:-0.0573,fav:false,visited:false,note:"E1W – Thames-siden"},
  // WEST
  {name:"Queen's Park (Lonsdale / Salusbury)",zone:"West",lat:51.5369,lng:-0.2041,fav:true,visited:true,note:"NW6 – farmers' market søndag"},
  {name:"Golborne Road",zone:"West",lat:51.5226,lng:-0.2075,fav:true,visited:true,note:"W10 – østkant på vestkant"},
  {name:"Clarendon Cross",zone:"West",lat:51.5104,lng:-0.2102,fav:true,visited:true,note:"W11 – Holland Park"},
  {name:"Westbourne Grove",zone:"West",lat:51.5152,lng:-0.1939,fav:true,visited:true,note:"W2 – Notting Hill"},
  {name:"Chelsea Green",zone:"West",lat:51.4907,lng:-0.1660,fav:true,visited:true,note:"SW3"},
  {name:"Turnham Green / Chiswick High Rd",zone:"West",lat:51.4920,lng:-0.2663,fav:false,visited:true,note:"W4 – Chiswick Mall til Hammersmith"},
  {name:"Fulham / Parsons Green",zone:"West",lat:51.4735,lng:-0.1981,fav:false,visited:true,note:"SW6"},
  {name:"Barnes Village",zone:"West",lat:51.4738,lng:-0.2492,fav:false,visited:true,note:"SW13 – Thames-siden"},
  {name:"Little Venice",zone:"West",lat:51.5233,lng:-0.1838,fav:false,visited:true,note:"W9 – Warwick Avenue"},
  {name:"Richmond",zone:"West",lat:51.4613,lng:-0.3037,fav:false,visited:true,note:"TW9 – Richmond Park"},
  {name:"Kew Green",zone:"West",lat:51.4852,lng:-0.2880,fav:false,visited:true,note:"TW9 – Kew Gardens"},
];

// Map init
const map = L.map('map', {
  center: [51.515, -0.13],
  zoom: 12,
  zoomControl: true
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
  maxZoom: 19
}).addTo(map);

// Five-pointed star path, centered at (cx, cy), given outer/inner radius
function starPath(cx, cy, rOuter, rInner) {
  let pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? rOuter : rInner;
    const angle = (Math.PI / 5) * i - Math.PI / 2;
    pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
  }
  return pts.join(" ");
}

// Custom marker factory
function makeIcon(zone, fav, visited) {
  const color = ZONE_COLORS[zone];
  const fill = visited ? color : "white";
  const strokeColor = visited ? "white" : color;

  if (fav) {
    const size = 26;
    const c = size / 2;
    const points = starPath(c, c, 11, 4.6);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
      <polygon points="${points}" fill="${fill}" stroke="${strokeColor}" stroke-width="${visited ? 1.8 : 2.4}" stroke-linejoin="round"/>
    </svg>`;
    return L.divIcon({
      html: svg,
      className: '',
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2 - 2]
    });
  }

  const size = 11, border = 2;
  const total = size + border * 2;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${total}" height="${total}">
    <circle cx="${total/2}" cy="${total/2}" r="${size/2}" fill="${fill}" stroke="${strokeColor}" stroke-width="${visited ? border : 2.4}"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [total, total],
    iconAnchor: [total/2, total/2],
    popupAnchor: [0, -total/2 - 2]
  });
}

// State
let activeFilter = "all";
let searchQuery = "";
const markers = [];
const listItems = [];

// Build markers + sidebar
const zones = ["Central","North","South","East","West"];
const listEl = document.getElementById("sidebar-list");

zones.forEach(zone => {
  const zonePlaces = PLACES.filter(p => p.zone === zone);
  const groupEl = document.createElement("div");
  groupEl.className = "zone-group";
  groupEl.dataset.zone = zone;

  const labelEl = document.createElement("div");
  labelEl.className = "zone-label";
  labelEl.textContent = zone;
  labelEl.style.color = ZONE_COLORS[zone];
  groupEl.appendChild(labelEl);

  zonePlaces.forEach(p => {
    // Marker
    const marker = L.marker([p.lat, p.lng], {icon: makeIcon(p.zone, p.fav, p.visited)});
    const popupHtml = `
      <div class="popup-inner">
        <div class="popup-zone" style="color:${ZONE_COLORS[p.zone]}">${p.zone}</div>
        <div class="popup-name">${p.name}</div>
        <div class="popup-note">${p.note}</div>
      </div>
      ${p.fav ? '<div class="popup-fav">⭐ Favoritt</div>' : ''}
      ${!p.visited ? '<div class="popup-notvisited">○ Ikke besøkt ennå</div>' : ''}
    `;
    marker.bindPopup(popupHtml, {className: 'custom-popup', maxWidth: 240});
    marker.addTo(map);
    markers.push({marker, place: p});

    // Sidebar item
    const itemEl = document.createElement("div");
    itemEl.className = "place-item" + (!p.visited ? " not-visited" : "");
    itemEl.dataset.zone = p.zone;
    itemEl.dataset.fav = p.fav ? "1" : "0";
    itemEl.dataset.name = p.name.toLowerCase();
    itemEl.innerHTML = `
      <div class="place-dot" style="background:${p.visited ? ZONE_COLORS[p.zone] : 'white'};border:2px solid ${ZONE_COLORS[p.zone]}"></div>
      <div class="place-item-text">
        <div class="place-item-name">${p.fav ? '<span class="star">⭐</span>' : ''}${p.name}</div>
        <div class="place-item-note">${p.note}${!p.visited ? ' · <em>ikke besøkt</em>' : ''}</div>
      </div>`;
    itemEl.addEventListener("click", () => {
      map.setView([p.lat, p.lng], 15);
      marker.openPopup();
      document.querySelectorAll(".place-item").forEach(el => el.classList.remove("active"));
      itemEl.classList.add("active");
    });
    marker.on("click", () => {
      document.querySelectorAll(".place-item").forEach(el => el.classList.remove("active"));
      itemEl.classList.add("active");
      itemEl.scrollIntoView({behavior: "smooth", block: "nearest"});
    });
    groupEl.appendChild(itemEl);
    listItems.push(itemEl);
  });
  listEl.appendChild(groupEl);
});

// Legend
const legend = L.control({position: "bottomright"});
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "map-legend");
  div.innerHTML = `
    <div class="legend-title">Sone</div>
    ${zones.map(z => `<div class="legend-row"><div class="legend-dot" style="background:${ZONE_COLORS[z]}"></div>${z}</div>`).join("")}
    <div style="margin-top:6px;padding-top:6px;border-top:1px solid #eee">
      <div class="legend-row">${starPath ? '<svg width="12" height="12"><polygon points="' + starPath(6,6,5.5,2.3) + '" fill="#999"/></svg>' : '⭐'} Favoritt (stjerne)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#999"></div> Andre muligheter (prikk)</div>
      <div class="legend-row"><div class="legend-dot" style="background:white;border:2px solid #999"></div> Ikke besøkt ennå (hul)</div>
    </div>`;
  return div;
};
legend.addTo(map);

// Filter + search logic
function updateVisibility() {
  let showing = 0;
  const groups = listEl.querySelectorAll(".zone-group");

  groups.forEach(group => {
    const zone = group.dataset.zone;
    let anyVisible = false;
    group.querySelectorAll(".place-item").forEach(item => {
      const zoneMatch = activeFilter === "all" || activeFilter === zone || (activeFilter === "fav" && item.dataset.fav === "1");
      const searchMatch = !searchQuery || item.dataset.name.includes(searchQuery);
      const visible = zoneMatch && searchMatch;
      item.classList.toggle("hidden", !visible);
      if (visible) { anyVisible = true; showing++; }
    });
    group.style.display = anyVisible ? "" : "none";
  });

  markers.forEach(({marker, place}) => {
    const zoneMatch = activeFilter === "all" || activeFilter === place.zone || (activeFilter === "fav" && place.fav);
    const searchMatch = !searchQuery || place.name.toLowerCase().includes(searchQuery);
    if (zoneMatch && searchMatch) {
      if (!map.hasLayer(marker)) marker.addTo(map);
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });

  document.getElementById("footer-count").textContent = `${showing} av ${PLACES.length} vises`;
  document.getElementById("count-label").textContent = `· ${showing} steder`;
}

// Filter buttons
document.querySelectorAll(".zone-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll(".zone-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    updateVisibility();
  });
});

// Search
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase().trim();
  updateVisibility();
});

// KML download
document.getElementById("dl-kml").addEventListener("click", () => {
  const folders = zones.map(zone => {
    const ps = PLACES.filter(p => p.zone === zone);
    const marks = ps.map(p => `
    <Placemark>
      <name>${p.fav ? "⭐ " : ""}${p.name}${!p.visited ? " (ikke besøkt)" : ""}</name>
      <description>${p.note} | ${p.fav ? "Favoritt" : "Andre muligheter"}${!p.visited ? " | Ikke besøkt ennå" : ""}</description>
      <styleUrl>${p.fav ? "#fav" : "#other"}</styleUrl>
      <Point><coordinates>${p.lng},${p.lat},0</coordinates></Point>
    </Placemark>`).join("");
    return `<Folder><name>${zone}</name>${marks}</Folder>`;
  }).join("");

  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
  <name>London Nabolag</name>
  <Style id="fav"><IconStyle><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/ylw-stars.png</href></Icon></IconStyle></Style>
  <Style id="other"><IconStyle><scale>0.9</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/grn-circle.png</href></Icon></IconStyle></Style>
  ${folders}
</Document></kml>`;

  const a = document.createElement("a");
  a.href = "data:application/vnd.google-earth.kml+xml;charset=utf-8," + encodeURIComponent(kml);
  a.download = "london-nabolag.kml";
  a.click();
});

updateVisibility();
</script>
</body>
</html>
